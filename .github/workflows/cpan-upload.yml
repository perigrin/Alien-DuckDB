name: Upload to CPAN

on:
  push:
    tags:
      - 'v*'  # Run when tag matches v*, e.g. v0.03, v1.0.0
  workflow_dispatch:  # Allow manual triggering through the GitHub UI

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    name: Build and upload to CPAN

    env:
      # Resolve modules from the mirror's own index rather than cpanmetadb,
      # which can name distfiles that have since been withdrawn from CPAN.
      # Same fix as install.yml; these two workflows must not drift apart.
      PERL_CPANM_OPT: --mirror-only

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.44'

      - name: Verify the tag matches $VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          ver=$(perl -MExtUtils::MakeMaker -e 'print MM->parse_version(q{lib/Alien/DuckDB.pm})')
          echo "tag=$tag  \$VERSION=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag v$tag does not match \$VERSION $ver in lib/Alien/DuckDB.pm."
            echo "::error::Nothing reads the tag, so the build would ship $ver regardless."
            exit 1
          fi

      - name: Install core build tools
        run: |
          cpanm --notest ExtUtils::MakeMaker
          cpanm --notest Alien::Build
          cpanm --notest Alien::Build::MM
          cpanm --notest Path::Tiny
          cpanm --notest Sort::Versions
          cpanm --notest URI
          cpanm --notest URI::Escape
          
      - name: Check alienfile and Makefile.PL
        run: |
          echo "Current directory contents:"
          ls -la
          echo "Alienfile contents:"
          cat alienfile
          echo "Makefile.PL contents:"
          cat Makefile.PL

      - name: Configure manually
        run: perl Makefile.PL
      
      - name: Check for MYMETA files
        run: |
          echo "After Makefile.PL, checking for MYMETA files:"
          ls -la
          if [ -f "MYMETA.json" ]; then
            echo "MYMETA.json exists"
          else
            echo "MYMETA.json does not exist"
          fi
          if [ -f "MYMETA.yml" ]; then
            echo "MYMETA.yml exists"
          else
            echo "MYMETA.yml does not exist"
          fi
      
      - name: Install dependencies
        run: |
          cpanm --notest --installdeps .
      
      - name: Build
        run: make
      
      - name: Test
        run: make test
      
      - name: Create distribution
        run: make dist
      
      - name: List distribution files
        run: ls -la *.tar.gz
      
      - name: Upload to CPAN
        # Pinned: this action last changed in 2022 and receives PAUSE_PASSWORD,
        # so it must not float on whatever master happens to be at release time.
        uses: thibaultduponchelle/action-upload-to-cpan@a026cc0a0de20c07f6517d8499d0b86a46b0fbf1
        with:
          username: ${{ secrets.PAUSE_USERNAME }}
          password: ${{ secrets.PAUSE_PASSWORD }}
          
      - name: Archive build logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/.cpanm/work/*/build.log
            *.log
          retention-days: 7
